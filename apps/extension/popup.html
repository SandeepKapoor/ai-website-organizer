<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AI Website Organizer</title>
    <style>
      body {
        width: 280px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 16px;
        color: #111;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      p {
        font-size: 12px;
        color: #555;
        margin: 4px 0;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 13px;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        padding: 8px 10px;
        font-size: 13px;
        font-weight: 500;
        border: none;
        border-radius: 999px;
        background: #111;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: #111;
        border: 1px solid #ddd;
        margin-top: 6px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
      }
    </style>
  </head>
  <body>
    <h1>AI Website Organizer</h1>
    <div id="disconnected-view">
      <p>Connect this Chrome profile to import its bookmarks.</p>
      <input id="profile-name" placeholder="Profile name (e.g. Personal)" value="Personal" />
      <button id="connect-btn">Connect this profile</button>
    </div>
    <div id="connected-view" style="display: none">
      <div class="status"><span class="dot"></span><span id="status-text"></span></div>
      <button id="reimport-btn" class="secondary">Re-sync now</button>
      <button id="disconnect-btn" class="secondary">Disconnect</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
